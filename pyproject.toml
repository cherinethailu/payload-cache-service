[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payload-cache"
version = "0.1.0"
description = "FastAPI microservice that generates payloads and caches transformer results"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cache-cli = "payload_cache.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/payload_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
